name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run unit tests
        run: python -m pytest -v

      - name: Bandit (SAST)
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Semgrep (SAST)
        continue-on-error: true
        run: |
          semgrep scan \
            --config security/semgrep/rules.yml \
            --metrics=off \
            --json \
            --output reports/semgrep-report.json \
            app/

      - name: pip-audit (dependencies)
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:latest image \
            --format json \
            --output /reports/trivy-report.json \
            vulnfinbot:latest

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn